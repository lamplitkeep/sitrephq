name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: minimal (default -> :latest, :<tag>)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: minimal
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lamplitkeep/sitrephq:latest
            ghcr.io/lamplitkeep/sitrephq:${{ github.ref_name }}
      - name: full (-> :full, :<tag>-full)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lamplitkeep/sitrephq:full
            ghcr.io/lamplitkeep/sitrephq:${{ github.ref_name }}-full

  binaries:
    runs-on: ubuntu-latest
    container: rust:1-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: build release binaries
        run: cargo build --release --workspace
      - name: rename for release
        run: |
          cp target/release/sitrep sitrep-linux-x86_64
          cp target/release/sitrep-agent sitrep-agent-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sitrep-linux-x86_64
            sitrep-agent-linux-x86_64