[package]
name = "sitrep"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
humantime-serde = "1.1.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.1.0", features = ["include"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
